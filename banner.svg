<svg xmlns="http://w3.org" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Background with dark-mode charcoal styling -->
  <rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  
  <!-- Subtle decorative technical grid pattern in background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160 M 0,200 L 800,200" />
    <path d="M 100,0 L 100,240 M 200,0 L 200,240 M 300,0 L 300,240 M 400,0 L 400,240 M 500,0 L 500,240 M 600,0 L 600,240 M 700,0 L 700,240" />
  </g>

  <!-- Glowing Diagnostic Emblem (Stethoscope + Code Brackets Matrix) -->
  <g transform="translate(60, 45)">
    <!-- Outer pulse ring -->
    <circle cx="75" cy="75" r="65" fill="none" stroke="#238636" stroke-width="2" opacity="0.3" stroke-dasharray="8 4"/>
    <!-- Tech Medical Cross Base -->
    <rect x="63" y="40" width="24" height="70" rx="4" fill="#238636" opacity="0.8"/>
    <rect x="40" y="63" width="70" height="24" rx="4" fill="#238636" opacity="0.8"/>
    <!-- Inside Terminal UI symbol -->
    <path d="M 58,68 L 50,75 L 58,82 M 92,68 L 100,75 L 92,82" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="78" y1="65" x2="72" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Layout -->
  <g transform="translate(240, 115)">
    <!-- Main Title Brand -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1">RepoDoctor</text>
    <!-- Version Tag Badge -->
    <rect x="275" y="-36" width="54" height="22" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="284" y="-21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">v1.2.1</text>
    <!-- Tagline Subtext -->
    <text y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e" letter-spacing="0.5">Automated Codebase Diagnostic Tool for AI Generators</text>
    <!-- Zero Dependency Badge Element -->
    <g transform="translate(0, 60)">
      <rect width="135" height="24" rx="12" fill="#238636" opacity="0.15"/>
      <rect width="135" height="24" rx="12" fill="none" stroke="#238636" stroke-width="1"/>
      <circle cx="16" cy="12" r="4" fill="#2ea44f"/>
      <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2ea44f">ZERO DEPENDENCIES</text>
    </g>
    <!-- AI-Prompt Optimized Badge Element -->
    <g transform="translate(147, 60)">
      <rect width="145" height="24" rx="12" fill="#1f6feb" opacity="0.15"/>
      <rect width="145" height="24" rx="12" fill="none" stroke="#1f6feb" stroke-width="1"/>
      <circle cx="16" cy="12" r="4" fill="#58a6ff"/>
      <text x="28" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">AI-PROMPT OPTIMIZED</text>
    </g>
  </g>
</svg>
